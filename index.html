<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boys in the Boat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --ink: #0B1F14;
    --turf-dark: #0D1B2A;
    --turf-mid: #1B3A5C;
    --turf-line: #2E5A8C;
    --chalk: #F5F5F0;
    --chalk-dim: #A8B8C8;
    --gold: #FFB627;
    --gold-dim: #D69A1F;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--turf-dark);
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 80px);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  /* ---------- Header ---------- */
  header {
    padding: 36px 24px 20px;
    text-align: center;
  }
  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
  }
  h1 {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(38px, 8vw, 68px);
    letter-spacing: 1px;
    margin: 6px 0 4px;
    color: var(--chalk);
    text-transform: uppercase;
    line-height: 1;
  }
  .subline {
    font-size: 14px;
    color: var(--chalk-dim);
  }

  /* ---------- Tabs ---------- */
  nav.tabs {
    display: flex;
    justify-content: center;
    gap: 4px;
    padding: 0 16px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--turf-line);
    margin: 28px auto 28px;
    max-width: 900px;
  }
  .tab-btn {
      background: none;
      border: none;
      color: var(--chalk-dim);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 14px 18px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
    }
    .tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
    .panel { display: none; }
    .panel.active { display: block; }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .panel-title {
    font-family: 'Anton', sans-serif;
    font-size: 22px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--chalk);
  }
  .sync-note {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: var(--chalk-dim);
  }

  .card {
    background: var(--turf-mid);
    border: 1px solid var(--turf-line);
    border-radius: 6px;
    overflow: hidden;
  }

  /* ---------- Tables ---------- */
  /* table-layout: fixed makes the % widths on <th> actually control column
     size, instead of letting long text stretch a column wider than intended. */
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold-dim);
    text-align: left;
    padding: 12px 14px;
    border-bottom: 1px solid var(--turf-line);
  }
  td {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  tr:last-child td { border-bottom: none; }
  .rank-badge {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    color: var(--gold);
  }
  .stat-num { font-family: 'Space Mono', monospace; }
  .loading-row td, .error-row td {
    padding: 24px;
    text-align: center;
    color: var(--chalk-dim);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.5px;
    white-space: normal;
  }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 11px;
    color: var(--chalk-dim);
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.5px;
  }

  /* ---------- Map labels ---------- */
  .dinner-map-label {
    background: var(--ink);
    border: 1px solid var(--gold-dim);
    color: var(--chalk);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3px;
    padding: 3px 8px;
    border-radius: 3px;
    box-shadow: none;
  }
  .dinner-map-label::before {
    border-top-color: var(--gold-dim);
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Est. 2021</div>
  <h1>Boys in the Boat</h1>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="standings">Standings</button>
  <button class="tab-btn" data-tab="history">League History</button>
  <button class="tab-btn" data-tab="dinners">Dinner Locations</button>
</nav>

<main>
  <section class="panel active" id="panel-standings">
    <div class="panel-head">
      <div class="panel-title">Standings</div>
    </div>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th style="width:8%">#</th>
            <th style="width:44%">Team</th>
            <th style="width:16%">W</th>
            <th style="width:16%">L</th>
            <th style="width:16%">PF</th>
          </tr>
        </thead>
        <tbody id="standingsBody">
          <tr class="loading-row"><td colspan="5">Loading standings&hellip;</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="panel" id="panel-history">
    <div class="panel-head">
      <div class="panel-title">Season History</div>
    </div>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th style="width:13%">Year</th>
            <th style="width:29%">Winner</th>
            <th style="width:29%">Bottom Two</th>
            <th style="width:29%">Dinner Location</th>
          </tr>
        </thead>
        <tbody id="seasonHistoryBody">
          <tr class="loading-row"><td colspan="4">Loading&hellip;</td></tr>
        </tbody>
      </table>
    </div>

    <div class="panel-head" style="margin-top: 32px;">
      <div class="panel-title">Career Record</div>
    </div>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th style="width:44%">Owner</th>
            <th style="width:28%">Championships</th>
            <th style="width:28%">Bottom Two Finishes</th>
          </tr>
        </thead>
        <tbody id="careerRecordBody">
          <tr class="loading-row"><td colspan="3">Loading&hellip;</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="panel" id="panel-dinners">
    <div class="panel-head">
      <div class="panel-title">Dinner Locations</div>
    </div>
    <div class="card" style="padding: 12px;">
      <div id="dinnerMap" style="height: 400px; border-radius: 4px;"></div>
    </div>

    <div id="dinnerYearsContainer"></div>
  </section>
</main>

<footer></footer>

<script>
  // CSV export links for each tab in your published Google Sheet.
  // If you rename a tab, update the corresponding "sheet=" value below to match exactly.
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/18CCo3E0tpNDDiBHBTDsOUR6id6NUiHSENk25Igrr2T0/gviz/tq?tqx=out:csv&sheet=Standings';
  const SEASON_HISTORY_CSV = 'https://docs.google.com/spreadsheets/d/18CCo3E0tpNDDiBHBTDsOUR6id6NUiHSENk25Igrr2T0/gviz/tq?tqx=out:csv&sheet=History1';
  const CAREER_RECORD_CSV = 'https://docs.google.com/spreadsheets/d/18CCo3E0tpNDDiBHBTDsOUR6id6NUiHSENk25Igrr2T0/gviz/tq?tqx=out:csv&sheet=History2';

  // Basic CSV line parser that handles quoted fields containing commas.
  function parseCsvLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        if (inQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        result.push(current);
        current = '';
      } else {
        current += char;
      }
    }
    result.push(current);
    return result;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  async function loadStandings() {
    const body = document.getElementById('standingsBody');
    try {
      const res = await fetch(CSV_URL);
      if (!res.ok) throw new Error('Fetch failed: ' + res.status);
      const text = await res.text();

      const lines = text.trim().split('\n').filter(l => l.trim().length > 0);
      const dataLines = lines.slice(1); // drop header row (Team, W, L, PF)

      const teams = dataLines.map(line => {
        const cols = parseCsvLine(line);
        return {
          team: (cols[0] || '').trim(),
          w: parseInt(cols[1], 10) || 0,
          l: parseInt(cols[2], 10) || 0,
          pf: parseFloat(cols[3]) || 0
        };
      }).filter(t => t.team.length > 0);

      if (teams.length === 0) {
        body.innerHTML = '<tr class="loading-row"><td colspan="5">No teams found in the sheet yet.</td></tr>';
        return;
      }

      teams.sort((a, b) => (b.w - a.w) || (b.pf - a.pf));

      body.innerHTML = teams.map((t, i) => `
        <tr>
          <td class="rank-badge">${i + 1}</td>
          <td>${escapeHtml(t.team)}</td>
          <td class="stat-num">${t.w}</td>
          <td class="stat-num">${t.l}</td>
          <td class="stat-num">${t.pf}</td>
        </tr>
      `).join('');
    } catch (err) {
      console.error('Failed to load standings:', err);
      body.innerHTML = '<tr class="error-row"><td colspan="5">Couldn\'t load standings right now. Try refreshing.</td></tr>';
    }
  }

  async function loadSeasonHistory() {
    const body = document.getElementById('seasonHistoryBody');
    try {
      const res = await fetch(SEASON_HISTORY_CSV);
      if (!res.ok) throw new Error('Fetch failed: ' + res.status);
      const text = await res.text();
      const lines = text.trim().split('\n').filter(l => l.trim().length > 0);
      // Expects 5 columns per row: Year, Winner, Bottom Two, Dinner Location, Address
      const rows = lines.slice(1).map(parseCsvLine).filter(cols => (cols[0] || '').trim().length > 0);

      if (rows.length === 0) {
        body.innerHTML = '<tr class="loading-row"><td colspan="4">No seasons logged yet.</td></tr>';
        return;
      }

      // Most recent year first
      rows.sort((a, b) => (parseInt(b[0]) || 0) - (parseInt(a[0]) || 0));

      body.innerHTML = rows.map(cols => `
        <tr>
          <td class="stat-num">${escapeHtml(cols[0])}</td>
          <td>${escapeHtml(cols[1])}</td>
          <td>${escapeHtml(cols[2])}</td>
          <td>${escapeHtml(cols[3] || '')}</td>
        </tr>
      `).join('');

      renderDinnerMap(rows);
      renderDinnerYearSections(rows);
    } catch (err) {
      console.error('Failed to load season history:', err);
      body.innerHTML = '<tr class="error-row"><td colspan="4">Couldn\'t load season history.</td></tr>';
    }
  }

  // Turns each row's Dinner Location address into a map marker.
  // Uses Nominatim (OpenStreetMap's free geocoding service) since it needs no API key.
  // Nominatim asks that requests go no faster than ~1/second, so we geocode one at a time
  // with a small delay rather than firing all requests simultaneously.
  // Builds one heading + photo placeholder block per year, so each has a
  // stable, linkable id (dinner-year-2025, etc.) that the map popups can jump to.
  function renderDinnerYearSections(rows) {
    const container = document.getElementById('dinnerYearsContainer');
    if (!container) return;

    const sorted = [...rows].sort((a, b) => (parseInt(b[0]) || 0) - (parseInt(a[0]) || 0));

    container.innerHTML = sorted.map(cols => {
      const year = (cols[0] || '').trim();
      if (!year) return '';
      return `
        <div class="panel-head" style="margin-top: 32px;">
          <div class="panel-title">${escapeHtml(year)}</div>
        </div>
        <div class="card" id="dinner-year-${escapeHtml(year)}" style="padding: 20px;">
          <p style="color: var(--chalk-dim);">Photos coming soon.</p>
        </div>
      `;
    }).join('');
  }

  let dinnerMapInstance = null;
  let dinnerMapBounds = null;

  async function renderDinnerMap(rows) {
    const mapEl = document.getElementById('dinnerMap');
    if (!mapEl || typeof L === 'undefined') return;

    const map = L.map('dinnerMap', {
      zoomControl: false,
      dragging: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      touchZoom: false,
      boxZoom: false,
      keyboard: false
    }).setView([41.8781, -87.6298], 4); // default center, adjusts once pins load
    dinnerMapInstance = map;

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      subdomains: 'abc',
      maxZoom: 19
    }).addTo(map);

    const markers = [];

    for (const cols of rows) {
      const year = (cols[0] || '').trim();
      const winner = (cols[1] || '').trim();
      const losers = (cols[2] || '').trim();
      const locationName = (cols[3] || '').trim();
      const address = (cols[4] || '').trim();
      if (!address) continue;

      try {
        const geoRes = await fetch(
          'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(address)
        );
        const geoData = await geoRes.json();
        if (geoData && geoData.length > 0) {
          const lat = parseFloat(geoData[0].lat);
          const lon = parseFloat(geoData[0].lon);
          const marker = L.marker([lat, lon]).addTo(map);
          const label = locationName || address;
          const popupParts = [`<b>${escapeHtml(year)}</b> &mdash; ${escapeHtml(label)}`];
          if (winner) popupParts.push('Winner: ' + escapeHtml(winner));
          if (losers) popupParts.push('Bottom Two: ' + escapeHtml(losers));
          popupParts.push(`<a href="#dinner-year-${escapeHtml(year)}" onclick="goToDinnerYear('${year.replace(/'/g, "\\'")}'); return false;">Pictures</a>`);
          marker.bindPopup(popupParts.join('<br>'));
          marker.bindTooltip(`${escapeHtml(year)} &mdash; ${escapeHtml(label)}`, {
            permanent: true,
            direction: 'top',
            offset: [0, -8],
            className: 'dinner-map-label'
          });
          markers.push(marker);
        }
      } catch (err) {
        console.error('Geocoding failed for address:', address, err);
      }

      // Small delay between requests to stay within Nominatim's usage policy.
      await new Promise(resolve => setTimeout(resolve, 1100));
    }

    if (markers.length > 0) {
      const group = L.featureGroup(markers);
      dinnerMapBounds = group.getBounds().pad(0.2);
      map.fitBounds(dinnerMapBounds);
    }
  }

  async function loadCareerRecord() {
    const body = document.getElementById('careerRecordBody');
    try {
      const res = await fetch(CAREER_RECORD_CSV);
      if (!res.ok) throw new Error('Fetch failed: ' + res.status);
      const text = await res.text();
      const lines = text.trim().split('\n').filter(l => l.trim().length > 0);
      // Expects 3 columns per row: Owner, Championships, Bottom Two Finishes
      const rows = lines.slice(1).map(parseCsvLine).filter(cols => (cols[0] || '').trim().length > 0);

      if (rows.length === 0) {
        body.innerHTML = '<tr class="loading-row"><td colspan="3">No owners found.</td></tr>';
        return;
      }

      // Most championships first
      rows.sort((a, b) => (parseInt(b[1]) || 0) - (parseInt(a[1]) || 0));

      body.innerHTML = rows.map(cols => `
        <tr>
          <td>${escapeHtml(cols[0])}</td>
          <td class="stat-num">${escapeHtml(cols[1])}</td>
          <td class="stat-num">${escapeHtml(cols[2])}</td>
        </tr>
      `).join('');
    } catch (err) {
      console.error('Failed to load career record:', err);
      body.innerHTML = '<tr class="error-row"><td colspan="3">Couldn\'t load career record.</td></tr>';
    }
  }

  loadStandings();
  loadSeasonHistory();
  loadCareerRecord();
</script>

<script>
  // Called from the "Pictures" link inside a map popup. Reuses the normal tab-click
  // logic (so the map still resizes/refits correctly), then scrolls to that year's section.
  function goToDinnerYear(year) {
    const dinnersBtn = document.querySelector('.tab-btn[data-tab="dinners"]');
    if (dinnersBtn) dinnersBtn.click();

    setTimeout(() => {
      const target = document.getElementById('dinner-year-' + year);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 250);
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');

    // Leaflet miscalculates its size if initialized while its tab was hidden.
    // Whenever the History tab becomes visible, tell it to recheck its real size.
    if (btn.dataset.tab === 'dinners' && dinnerMapInstance) {
      setTimeout(() => {
        dinnerMapInstance.invalidateSize();
        if (dinnerMapBounds) {
          dinnerMapInstance.fitBounds(dinnerMapBounds);
        }
      }, 100);
    }
  });
});
</script>

</body>
</html>
