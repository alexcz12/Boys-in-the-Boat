<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boys in the Boat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B1F14;
    --turf-dark: #0D1B2A;
    --turf-mid: #1B3A5C;
    --turf-line: #2E5A8C;
    --chalk: #F5F5F0;
    --chalk-dim: #A8B8C8;
    --gold: #FFB627;
    --gold-dim: #D69A1F;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--turf-dark);
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 80px);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  /* ---------- Header ---------- */
  header {
    padding: 36px 24px 20px;
    text-align: center;
  }
  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
  }
  h1 {
    font-family: 'Anton', sans-serif;
    font-weight: 400;
    font-size: clamp(38px, 8vw, 68px);
    letter-spacing: 1px;
    margin: 6px 0 4px;
    color: var(--chalk);
    text-transform: uppercase;
    line-height: 1;
  }
  .subline {
    font-size: 14px;
    color: var(--chalk-dim);
  }

  /* ---------- Tabs ---------- */
  nav.tabs {
    display: flex;
    justify-content: center;
    gap: 4px;
    padding: 0 16px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--turf-line);
    margin: 28px auto 28px;
    max-width: 900px;
  }
  .tab-btn {
    background: none;
    border: none;
    color: var(--gold);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 14px 18px;
    cursor: default;
    border-bottom: 3px solid var(--gold);
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .panel-title {
    font-family: 'Anton', sans-serif;
    font-size: 22px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--chalk);
  }
  .sync-note {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: var(--chalk-dim);
  }

  .card {
    background: var(--turf-mid);
    border: 1px solid var(--turf-line);
    border-radius: 6px;
    overflow: hidden;
  }

  /* ---------- Standings table ---------- */
  table { width: 100%; border-collapse: collapse; }
  th {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold-dim);
    text-align: left;
    padding: 12px 14px;
    border-bottom: 1px solid var(--turf-line);
  }
  td {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    font-size: 14px;
  }
  tr:last-child td { border-bottom: none; }
  .rank-badge {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    color: var(--gold);
  }
  .stat-num { font-family: 'Space Mono', monospace; }
  .loading-row td, .error-row td {
    padding: 24px;
    text-align: center;
    color: var(--chalk-dim);
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.5px;
  }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 11px;
    color: var(--chalk-dim);
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Est. 2021</div>
  <h1>Boys in the Boat</h1>
</header>

<nav class="tabs">
  <button class="tab-btn">Standings</button>
</nav>

<main>
  <section id="panel-standings">
    <div class="panel-head">
      <div class="panel-title">Standings</div>
    </div>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th style="width:36px">#</th>
            <th>Team</th>
            <th style="width:50px">W</th>
            <th style="width:50px">L</th>
            <th style="width:90px">PF</th>
          </tr>
        </thead>
        <tbody id="standingsBody">
          <tr class="loading-row"><td colspan="5">Loading standings&hellip;</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script>
  // CSV export link for your published "Standings" tab.
  // If you republish the Sheet or change tabs, you may need to update this URL.
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/18CCo3E0tpNDDiBHBTDsOUR6id6NUiHSENk25Igrr2T0/gviz/tq?tqx=out:csv&sheet=Standings';

  // Basic CSV line parser that handles quoted fields containing commas.
  function parseCsvLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        if (inQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        result.push(current);
        current = '';
      } else {
        current += char;
      }
    }
    result.push(current);
    return result;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  async function loadStandings() {
    const body = document.getElementById('standingsBody');
    try {
      const res = await fetch(CSV_URL);
      if (!res.ok) throw new Error('Fetch failed: ' + res.status);
      const text = await res.text();

      const lines = text.trim().split('\n').filter(l => l.trim().length > 0);
      const dataLines = lines.slice(1); // drop header row (Team, W, L, PF)

      const teams = dataLines.map(line => {
        const cols = parseCsvLine(line);
        return {
          team: (cols[0] || '').trim(),
          w: parseInt(cols[1], 10) || 0,
          l: parseInt(cols[2], 10) || 0,
          pf: parseFloat(cols[3]) || 0
        };
      }).filter(t => t.team.length > 0);

      if (teams.length === 0) {
        body.innerHTML = '<tr class="loading-row"><td colspan="5">No teams found in the sheet yet.</td></tr>';
        return;
      }

      teams.sort((a, b) => (b.w - a.w) || (b.pf - a.pf));

      body.innerHTML = teams.map((t, i) => `
        <tr>
          <td class="rank-badge">${i + 1}</td>
          <td>${escapeHtml(t.team)}</td>
          <td class="stat-num">${t.w}</td>
          <td class="stat-num">${t.l}</td>
          <td class="stat-num">${t.pf}</td>
        </tr>
      `).join('');
    } catch (err) {
      console.error('Failed to load standings:', err);
      body.innerHTML = '<tr class="error-row"><td colspan="5">Couldn\'t load standings right now. Try refreshing.</td></tr>';
    }
  }

  loadStandings();
</script>

</body>
</html>
